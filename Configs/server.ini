# ASEAN Motor Club — Project Zomboid server config (override-only)
# Project Zomboid auto-generates every other key with Apocalypse defaults on
# first boot. Only the values we want to pin are listed here.
# Copied (no-clobber) to <servername>.ini on first boot.
#
# CRITICAL: PZ's ConfigFile parser splits on '=' but does NOT trim keys
# (ConfigFile.read → line.split("=")). Keys must have NO spaces around '='
# or the whole option is silently skipped (e.g. "Public = true" becomes
# key "Public " which never matches, falling back to defaults). Match PZ's
# own output format exactly: key=value, no spaces.

# --- Visibility ---
Public=true
PublicName=★★ ASEAN Motor Club ★★ | Project Zomboid
PublicDescription=<RGB:1,0.85,0>ASEAN Motor Club</RGB> community survival server. Apocalypse difficulty, PVE. Join us: discord.gg/aseanmotorclub
Password=
# PingLimit: 0 = DISABLED (no ping kick). Many SEA users have unstable/bad
# ping; a ping-based kick unfairly locks them out. Freely connect regardless
# of latency. (Admin override: /changeoption PingLimit <ms> + /reloadoptions.)
PingLimit=0

# --- Capacity ---
# Note: Build 42 renamed MaxPlayers to ServerPlayerCount. Set both so the cap is
# applied regardless of build.
MaxPlayers=32
ServerPlayerCount=32
MaxAccountsPerUser=2

# --- Gameplay ---
PVP=false
PauseEmpty=true
GlobalChat=true
NoFire=true

# Arcadia RV interiors must load BEFORE the base map or entering an RV door is
# treated as a forest/unmapped teleport ("Entry blocked"). vehicle_interior_arcadia75
# attaches to the Muldraugh, KY lots (map.info lots=Muldraugh, KY). Keep it before
# Muldraugh in Map=; PZ loads maps left-to-right.
Map=vehicle_interior_arcadia75;Muldraugh, KY

# Arcadia (workshop 3773972040) dedicated-server instructions require these
# anti-cheat levels; leave every other anti-cheat enabled.
AntiCheatSpeed=4
AntiCheatNoClip=4

