# ASEAN Motor Club — Project Zomboid server config (override-only)
# Project Zomboid auto-generates every other key with Apocalypse defaults on
# first boot. Only the values we want to pin are listed here.
# Copied (no-clobber) to <servername>.ini on first boot.

# --- Visibility ---
Public = true
PublicName = ★★ ASEAN Motor Club ★★ | Project Zomboid
PublicDescription = <RGB:1,0.85,0>ASEAN Motor Club</RGB> community survival server. Apocalypse difficulty, PVE. Join us: discord.gg/aseanmotorclub
Password =
PingLimit = 400

# --- Capacity ---
# Note: Build 42 renamed MaxPlayers to ServerPlayerCount. Set both so the cap is
# applied regardless of build.
MaxPlayers = 32
ServerPlayerCount = 32
MaxAccountsPerUser = 2

# --- Gameplay ---
PVP = false
PauseEmpty = true
GlobalChat = true
NoFire = true

